<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>协作待办 · 原木罗盘系统</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: "思源黑体", "Source Han Sans CN", "Microsoft YaHei", Arial, sans-serif;
    color: #3e2723;
    height: 100vh; height: 100dvh;
    display: flex; overflow: hidden;
    background: #fff;
  }

  /* ========== 侧栏（同 AdminSidebar #795548） ========== */
  .sidebar {
    width: 210px; flex-shrink: 0;
    background: #795548; color: #f5eeeb;
    display: flex; flex-direction: column;
    overflow-y: auto;
    scrollbar-color: #bda59a #795548;
  }
  .site-title {
    display: flex; align-items: center; gap: 10px;
    padding: 18px 16px 22px;
    font-size: 17px; font-weight: 700; color: #fff;
    border-bottom: 1px solid rgba(255,255,255,.12);
  }
  .site-title .logo {
    width: 34px; height: 34px; border-radius: 8px; flex-shrink: 0;
    background: #a1887f;
    display: flex; align-items: center; justify-content: center;
    font-size: 18px;
  }
  .menu { padding: 10px 0 20px; flex: 1; }
  .menu-item, .menu-sub {
    display: block; padding: 12px 22px;
    font-size: 15px; color: #f5eeeb; text-decoration: none; cursor: pointer;
    white-space: nowrap;
  }
  .menu-item:hover, .menu-sub:hover { background: #D7CCC8; color: #757575; }
  .menu-item.active { background: rgba(255,255,255,.15); color: #fff; }
  .menu-group { padding: 14px 22px 6px; font-size: 12px; color: #d7c4b9; letter-spacing: 1px; }
  .menu-sub { padding-left: 38px; font-size: 14px; }
  .menu-sub.active { background: rgba(255,255,255,.15); color: #fff; }

  /* ========== 右侧框架（同 Index.vue） ========== */
  .right { flex: 1; min-width: 0; display: flex; flex-direction: column; }
  .topbar {
    height: 60px; flex-shrink: 0;
    display: flex; align-items: center; justify-content: space-between;
    padding: 0 24px;
    box-shadow: 1px 1px 4px 2px rgba(154,158,165,.8);
    position: relative; z-index: 9; background: #fff;
  }
  .breadcrumb { font-size: 14px; color: #909399; }
  .breadcrumb b { color: #3e2723; font-weight: 600; }
  .user { display: flex; align-items: center; gap: 8px; color: #6f7374; font-size: 14px; }

  .page { flex: 1; overflow-y: auto; padding: 24px; }

  /* ========== Hero（同 DashBoard hero-card） ========== */
  .hero-card {
    display: flex; justify-content: space-between; align-items: stretch;
    padding: 26px 32px; border-radius: 18px;
    background: linear-gradient(135deg, #6d4c41 0%, #8d6e63 55%, #b08968 100%);
    color: #fff; margin-bottom: 20px;
  }
  .hero-card .subtitle { font-size: 15px; opacity: .9; }
  .hero-card .title { margin-top: 10px; font-size: 30px; font-weight: 700; }
  .hero-card .description { margin-top: 12px; max-width: 640px; line-height: 1.7; opacity: .95; font-size: 14px; }
  .hero-side { min-width: 200px; display: flex; flex-direction: column; justify-content: space-between; align-items: flex-end; }
  .hero-metric { text-align: right; }
  .hero-metric span { display: block; font-size: 14px; opacity: .85; }
  .hero-metric strong { display: block; margin-top: 10px; font-size: 38px; }
  .hero-update { font-size: 13px; opacity: .85; }

  /* ========== 概览指标卡（同 metric-card） ========== */
  .metric-row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; margin-bottom: 20px; }
  .metric-card {
    border: 1px solid #ebeef5; border-radius: 8px; padding: 18px 20px;
    box-shadow: 0 2px 4px rgba(0,0,0,.06); background: #fff;
    transition: box-shadow .2s;
  }
  .metric-card:hover { box-shadow: 0 4px 12px rgba(0,0,0,.12); }
  .metric-label { color: #8c8c8c; font-size: 14px; }
  .metric-value { margin-top: 8px; font-size: 28px; font-weight: 700; color: #5d4037; }
  .metric-desc { margin-top: 6px; line-height: 1.6; font-size: 13px; color: #999; }

  /* ========== 工具栏 ========== */
  .toolbar {
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 16px; gap: 12px; flex-wrap: wrap;
  }
  .filters { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .filters .label { font-size: 14px; color: #8c8c8c; }
  .chip {
    padding: 5px 14px; border-radius: 16px; font-size: 13px;
    border: 1px solid #d7ccc8; background: #fff; color: #5d4037;
    cursor: pointer; display: flex; align-items: center; gap: 6px;
  }
  .chip .dot { width: 18px; height: 18px; border-radius: 50%; font-size: 11px; color: #fff; display: flex; align-items: center; justify-content: center; }
  .chip:hover { background: #f5efec; }
  .chip.active { background: #795548; color: #fff; border-color: #795548; }
  .btn-new {
    padding: 8px 20px; border-radius: 6px; border: none;
    background: #795548; color: #fff; font-size: 14px; cursor: pointer;
  }
  .btn-new:hover { background: #5d4037; }
  .tag + .tag { margin-left: 6px; }

  /* ========== 项目工作区 ========== */
  .proj-panel {
    border: 1px solid #e8ddd6; border-radius: 12px; background: #fffdfb;
    padding: 18px 20px; margin-bottom: 16px;
  }
  .proj-head h3 { font-size: 16px; color: #5d4037; margin-bottom: 14px; }
  .proj-body { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; }
  .proj-col-title { font-size: 13px; color: #8c8c8c; margin-bottom: 8px; font-weight: 600; }
  .doc-row {
    display: flex; align-items: center; gap: 8px;
    padding: 8px 0; border-bottom: 1px solid #f5efec; font-size: 13px;
  }
  .doc-row:last-child { border-bottom: none; }
  .doc-row .doc-name { color: #5d4037; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .doc-row .doc-meta { color: #bcaaa4; font-size: 12px; white-space: nowrap; }
  @media (max-width: 960px) { .proj-body { grid-template-columns: 1fr; } }

  /* ========== 看板 ========== */
  .kanban { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; align-items: start; }
  .column {
    background: #f5efec; border-radius: 12px; padding: 12px;
    min-height: 420px; display: flex; flex-direction: column;
  }
  .column-head {
    display: flex; align-items: center; justify-content: space-between;
    padding: 4px 8px 12px;
  }
  .column-head .name { font-size: 15px; font-weight: 600; display: flex; align-items: center; gap: 8px; }
  .column-head .count {
    background: #d7ccc8; color: #5d4037; font-size: 12px;
    padding: 1px 9px; border-radius: 10px;
  }
  .column-head .add {
    border: none; background: transparent; color: #8d6e63;
    font-size: 18px; cursor: pointer; padding: 2px 6px; border-radius: 5px;
  }
  .column-head .add:hover { background: #e4dad3; }
  .cards { display: flex; flex-direction: column; gap: 10px; flex: 1; min-height: 60px; }
  .column.drag-over .cards { outline: 2px dashed #a1887f; outline-offset: 4px; border-radius: 8px; }

  .card {
    background: #fff; border-radius: 10px; padding: 14px 14px 12px;
    box-shadow: 0 1px 3px rgba(62,39,35,.12);
    cursor: grab; transition: box-shadow .15s, transform .15s;
    border-left: 4px solid transparent;
  }
  .card:hover { box-shadow: 0 4px 12px rgba(62,39,35,.18); transform: translateY(-1px); }
  .card.dragging { opacity: .45; cursor: grabbing; }
  .card.p-high { border-left-color: #c0392b; }
  .card.p-mid  { border-left-color: #e6a23c; }
  .card.p-low  { border-left-color: #90a955; }
  .card .card-title { font-size: 14px; font-weight: 600; color: #3e2723; line-height: 1.5; }
  .card .card-desc {
    margin-top: 6px; font-size: 12px; color: #8c8c8c; line-height: 1.6;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
  }
  .card .tag {
    display: inline-block; margin-top: 8px; padding: 1px 8px;
    border-radius: 4px; font-size: 11px;
  }
  .tag.high { background: #fdecea; color: #c0392b; }
  .tag.mid  { background: #fdf3e2; color: #b7791f; }
  .tag.low  { background: #eef3e2; color: #5f7d2a; }
  .card-foot {
    margin-top: 10px; padding-top: 10px; border-top: 1px solid #f1ece9;
    display: flex; align-items: center; justify-content: space-between;
  }
  .assignee { display: flex; align-items: center; gap: 6px; font-size: 12px; color: #6d4c41; }
  .avatar {
    width: 22px; height: 22px; border-radius: 50%;
    color: #fff; font-size: 11px;
    display: flex; align-items: center; justify-content: center; flex-shrink: 0;
  }
  .card-meta { display: flex; align-items: center; gap: 10px; font-size: 12px; color: #a1887f; }
  .card-meta .due.overdue { color: #c0392b; }
  .empty-hint {
    border: 2px dashed #d7ccc8; border-radius: 10px; padding: 18px 0;
    text-align: center; font-size: 12px; color: #bcaaa4;
  }

  /* ========== 成员管理 ========== */
  .member-row {
    display: flex; align-items: center; gap: 10px;
    padding: 10px 0; border-bottom: 1px solid #f5efec;
  }
  .member-row input[type=text] {
    flex: 1; padding: 7px 10px; border: 1px solid #dcdfe6; border-radius: 6px;
    font-size: 14px; color: #3e2723; font-family: inherit; outline: none;
    min-width: 0;
  }
  .member-row input[type=text]:focus { border-color: #8d6e63; }
  .member-row .task-count { font-size: 12px; color: #a1887f; white-space: nowrap; }
  .btn-del {
    border: 1px solid #f0c9c5; background: #fff; color: #c0392b;
    border-radius: 6px; padding: 6px 12px; font-size: 13px; cursor: pointer;
  }
  .btn-del:hover { background: #fdecea; }
  .color-input {
    width: 34px; height: 34px; padding: 0; border: none;
    background: none; cursor: pointer; border-radius: 50%; overflow: hidden; flex-shrink: 0;
  }

  /* ========== 弹窗 ========== */
  .mask {
    position: fixed; inset: 0; background: rgba(62,39,35,.45);
    display: none; align-items: center; justify-content: center; z-index: 100;
  }
  .mask.show { display: flex; }
  .dialog {
    width: 560px; max-width: calc(100vw - 40px); max-height: 86vh;
    background: #fff; border-radius: 14px; overflow: hidden;
    display: flex; flex-direction: column;
  }
  .dialog-head {
    padding: 18px 24px 14px; border-bottom: 1px solid #f1ece9;
    display: flex; align-items: center; justify-content: space-between;
  }
  .dialog-head h3 { font-size: 17px; color: #3e2723; }
  .dialog-head .close { border: none; background: none; font-size: 20px; color: #909399; cursor: pointer; }
  .dialog-body { padding: 20px 24px; overflow-y: auto; }
  .field { margin-bottom: 16px; }
  .field label { display: block; font-size: 13px; color: #8c8c8c; margin-bottom: 6px; }
  .field input[type=text], .field textarea, .field select, .field input[type=date] {
    width: 100%; padding: 8px 12px; border: 1px solid #dcdfe6; border-radius: 6px;
    font-size: 14px; color: #3e2723; font-family: inherit; outline: none;
  }
  .field textarea { min-height: 76px; resize: vertical; }
  .field input:focus, .field textarea:focus, .field select:focus { border-color: #8d6e63; }
  .field-row { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  .comment-item { display: flex; gap: 10px; padding: 10px 0; border-bottom: 1px solid #f5efec; }
  .comment-item:last-child { border-bottom: none; }
  .comment-item .who { font-size: 13px; font-weight: 600; color: #5d4037; }
  .comment-item .when { font-size: 11px; color: #bcaaa4; margin-left: 8px; font-weight: 400; }
  .comment-item .text { font-size: 13px; color: #5d4037; margin-top: 4px; line-height: 1.6; }
  .comment-input-row { display: flex; gap: 8px; margin-top: 12px; }
  .comment-input-row input { flex: 1; }
  .btn-send { padding: 8px 18px; border: none; border-radius: 6px; background: #795548; color: #fff; cursor: pointer; }
  .dialog-foot { padding: 14px 24px; border-top: 1px solid #f1ece9; display: flex; justify-content: flex-end; gap: 10px; }
  .btn { padding: 8px 20px; border-radius: 6px; font-size: 14px; cursor: pointer; border: 1px solid #dcdfe6; background: #fff; color: #606266; }
  .btn.primary { background: #795548; border-color: #795548; color: #fff; }
  .btn.primary:hover { background: #5d4037; }
  .btn.danger { color: #c0392b; border-color: #f0c9c5; }
  .btn.danger:hover { background: #fdecea; }

  @media (max-width: 1100px) {
    .metric-row { grid-template-columns: repeat(2, 1fr); }
    .kanban { grid-template-columns: 1fr; }
    .hero-card { flex-direction: column; gap: 16px; }
    .hero-side { align-items: flex-start; }
    .sidebar { display: none; }
  }
</style>
</head>
<body>

<aside class="sidebar">
  <div class="site-title"><span class="logo">🪵</span>原木罗盘系统</div>
  <nav class="menu">
    <a class="menu-item">仪表盘</a>
    <div class="menu-group">协作</div>
    <a class="menu-item active">协作待办</a>
    <div class="menu-group">社区运营</div>
    <a class="menu-item">圈子审核</a>
    <a class="menu-item">帖子审核</a>
    <a class="menu-item">搜索关键词</a>
    <div class="menu-group">支付运营</div>
    <a class="menu-item">充值订单</a>
    <a class="menu-item">提现处理</a>
    <div class="menu-group">运营配置</div>
    <a class="menu-item">Banner 配置</a>
    <a class="menu-item">弹窗海报</a>
    <div class="menu-group">系统</div>
    <a class="menu-item">系统设置</a>
  </nav>
</aside>

<div class="right">
  <div class="topbar">
    <div class="breadcrumb">首页 / <b>协作待办</b></div>
    <div class="user"><span class="avatar" style="background:#8d6e63">CO</span>管理员</div>
  </div>

  <main class="page">
    <div class="hero-card">
      <div>
        <div class="subtitle">原木罗盘系统</div>
        <div class="title">协作待办看板</div>
        <div class="description">项目协同制作待办清单：拖拽卡片流转状态，指派负责人并跟踪评论动态。</div>
      </div>
      <div class="hero-side">
        <div class="hero-metric">
          <span>进行中任务</span>
          <strong id="heroActive">0</strong>
        </div>
        <div class="hero-update" id="heroUpdate"></div>
      </div>
    </div>

    <div class="metric-row">
      <div class="metric-card">
        <div class="metric-label">待办任务</div>
        <div class="metric-value" id="mTodo">0</div>
        <div class="metric-desc">尚未开始处理的事项</div>
      </div>
      <div class="metric-card">
        <div class="metric-label">进行中</div>
        <div class="metric-value" id="mDoing">0</div>
        <div class="metric-desc">正在推进的开发事项</div>
      </div>
      <div class="metric-card">
        <div class="metric-label">已完成</div>
        <div class="metric-value" id="mDone">0</div>
        <div class="metric-desc">本周收口的任务</div>
      </div>
      <div class="metric-card">
        <div class="metric-label">已逾期</div>
        <div class="metric-value" id="mOverdue" style="color:#c0392b">0</div>
        <div class="metric-desc">超过截止日期未完成</div>
      </div>
    </div>

    <div class="toolbar" style="margin-bottom:12px">
      <div class="filters" id="projFilters">
        <span class="label">项目：</span>
      </div>
    </div>

    <div class="toolbar">
      <div class="filters" id="filters">
        <span class="label">负责人：</span>
      </div>
      <div style="display:flex; gap:10px;">
        <button class="btn-new" style="background:#8d6e63" onclick="openMembers()">成员管理</button>
        <button class="btn-new" onclick="openNew()">＋ 新建任务</button>
      </div>
    </div>

    <div class="proj-panel" id="projPanel" style="display:none">
      <div class="proj-head"><h3 id="projTitle"></h3></div>
      <div class="proj-body">
        <div>
          <div class="proj-col-title">项目评论</div>
          <div id="projCommentList"></div>
          <div class="comment-input-row">
            <input type="text" id="projCommentInput" placeholder="写下项目评论…" />
            <button class="btn-send" onclick="addProjComment()">发送</button>
          </div>
        </div>
        <div>
          <div class="proj-col-title">项目文档</div>
          <div id="docList"></div>
          <input type="file" id="docFile" style="display:none" onchange="uploadDoc(this)" />
          <button class="btn" style="margin-top:12px" onclick="document.getElementById('docFile').click()">＋ 上传文档</button>
        </div>
      </div>
    </div>

    <div class="kanban">
      <div class="column" data-col="todo">
        <div class="column-head">
          <span class="name">📋 待办 <span class="count" id="cTodo">0</span></span>
          <button class="add" title="添加卡片" onclick="openNew('todo')">＋</button>
        </div>
        <div class="cards" id="col-todo"></div>
      </div>
      <div class="column" data-col="doing">
        <div class="column-head">
          <span class="name">🚧 进行中 <span class="count" id="cDoing">0</span></span>
          <button class="add" title="添加卡片" onclick="openNew('doing')">＋</button>
        </div>
        <div class="cards" id="col-doing"></div>
      </div>
      <div class="column" data-col="done">
        <div class="column-head">
          <span class="name">✅ 已完成 <span class="count" id="cDone">0</span></span>
          <button class="add" title="添加卡片" onclick="openNew('done')">＋</button>
        </div>
        <div class="cards" id="col-done"></div>
      </div>
    </div>
  </main>
</div>

<!-- 任务详情弹窗 -->
<div class="mask" id="mask">
  <div class="dialog">
    <div class="dialog-head">
      <h3 id="dlgTitle">任务详情</h3>
      <button class="close" onclick="closeDialog()">×</button>
    </div>
    <div class="dialog-body">
      <div class="field">
        <label>任务标题</label>
        <input type="text" id="fTitle" />
      </div>
      <div class="field">
        <label>任务描述</label>
        <textarea id="fDesc"></textarea>
      </div>
      <div class="field-row">
        <div class="field">
          <label>负责人</label>
          <select id="fAssignee"></select>
        </div>
        <div class="field">
          <label>截止日期</label>
          <input type="date" id="fDue" />
        </div>
      </div>
      <div class="field-row">
        <div class="field">
          <label>优先级</label>
          <select id="fPriority">
            <option value="high">高</option>
            <option value="mid">中</option>
            <option value="low">低</option>
          </select>
        </div>
        <div class="field">
          <label>项目分类</label>
          <select id="fProj"></select>
        </div>
      </div>
      <div class="field">
        <label>评论动态</label>
        <div id="commentList"></div>
        <div class="comment-input-row">
          <input type="text" id="commentInput" placeholder="写下评论…" />
          <button class="btn-send" onclick="addComment()">发送</button>
        </div>
      </div>
    </div>
    <div class="dialog-foot">
      <button class="btn danger" onclick="deleteTask()">删除任务</button>
      <button class="btn" onclick="closeDialog()">取消</button>
      <button class="btn primary" onclick="saveTask()">保存</button>
    </div>
  </div>
</div>

<!-- 成员管理弹窗 -->
<div class="mask" id="memberMask">
  <div class="dialog" style="width:480px">
    <div class="dialog-head">
      <h3>负责人管理</h3>
      <button class="close" onclick="closeMembers()">×</button>
    </div>
    <div class="dialog-body">
      <div id="memberList"></div>
      <div class="member-row" style="border-bottom:none">
        <input type="color" id="newColor" class="color-input" value="#795548" title="头像颜色" />
        <input type="text" id="newName" placeholder="新成员名称" maxlength="6" />
        <button class="btn primary" onclick="addMember()">添加</button>
      </div>
    </div>
  </div>
</div>

<script>
  var MEMBERS = [
    { id: 13, name: 'CO',   color: '#8d6e63' },
    { id: 2,  name: '木头', color: '#6d4c41' },
    { id: 3,  name: '松果', color: '#a1887f' },
    { id: 4,  name: '树皮', color: '#5d4037' }
  ];

  var PROJS = [
    { id: 'lab',     name: '实验室', color: '#8d6e63', bg: '#f3edeb' },
    { id: 'backend', name: '后台',   color: '#409eff', bg: '#ecf5ff' },
    { id: 'main',    name: '主站',   color: '#67c23a', bg: '#f0f9eb' },
    { id: 'other',   name: '其他',   color: '#909399', bg: '#f4f4f5' }
  ];
  var projFilter = ''; // '' = 全部
  var projComments = {
    lab: [ { who: 13, when: '2026-10-19 20:15', text: '竞技场本周出匹配规则初稿，保卫战手感优化并行推进。' } ],
    backend: [ { who: 2, when: '2026-10-18 10:02', text: 'todo 三张表结构已定，等前端联调。' } ],
    main: [],
    other: []
  };
  var projDocs = {
    lab: [ { name: '原木竞技场-玩法设计草案.md', size: '18 KB', who: 13, when: '2026-10-19 20:20' } ],
    backend: [ { name: 'todo-表结构设计.sql', size: '3 KB', who: 2, when: '2026-10-18 10:05' } ],
    main: [],
    other: []
  };

  // 模拟数据（正式版来自 /todo 接口 + MySQL）
  var tasks = [
    { id: 1, col: 'todo', proj: 'lab', title: '原木竞技场：对战匹配规则设计', desc: '确定竞技场的进入条件、匹配机制与胜负结算奖励，输出设计文档。', assignee: 13, due: '2026-10-25', priority: 'high',
      comments: [{ who: 13, when: '2026-10-19 21:04', text: '先出初稿，下周和小木对齐。' }] },
    { id: 2, col: 'todo', proj: 'backend', title: '罗盘系统：协作待办接入后端', desc: '新增 routes/todo.js，建立 board/card/comment 三张表，JWT 鉴权。', assignee: 2, due: '2026-10-28', priority: 'mid', comments: [] },
    { id: 3, col: 'todo', proj: 'main', title: '社区敏感词库季度更新', desc: '整理近三个月新增违规样本，补充敏感词条目。', assignee: 3, due: '2026-10-22', priority: 'low', comments: [] },
    { id: 4, col: 'doing', proj: 'lab', title: '原木保卫战：村庄建造手感优化', desc: '拖拽放置的吸附范围和预览虚影跟随不流畅，需要调整插值参数。', assignee: 4, due: '2026-10-21', priority: 'high',
      comments: [
        { who: 4, when: '2026-10-18 15:30', text: '吸附阈值从 24px 调到 32px 后明显顺滑。' },
        { who: 13, when: '2026-10-19 09:12', text: '今天上线前记得回归测试移动端。' }
      ] },
    { id: 5, col: 'doing', proj: 'main', title: '入站必读书单洗牌逻辑修正', desc: '合并 PR#7 后确认 leaderboard 重建时书单随机化不再触发自动更新。', assignee: 13, due: '2026-10-20', priority: 'mid',
      comments: [{ who: 2, when: '2026-10-19 11:40', text: '本地已验证，等部署。' }] },
    { id: 6, col: 'doing', proj: 'backend', title: '图床 frp 链路巡检脚本', desc: '封面图 404 多为 frpc 掉线，写一个定时探活脚本自动告警。', assignee: 2, due: '2026-10-30', priority: 'low', comments: [] },
    { id: 7, col: 'done', proj: 'lab', title: '楼层切换按钮「地上」更名「上地」', desc: '原木保卫战文案修正，已随版本发布。', assignee: 3, due: '2026-10-15', priority: 'low',
      comments: [{ who: 3, when: '2026-10-15 18:02', text: '已上线。' }] },
    { id: 8, col: 'done', proj: 'backend', title: '管理端菜单搜索快捷键', desc: 'Ctrl+K 唤起菜单搜索，Enter 跳转。', assignee: 4, due: '2026-10-12', priority: 'mid', comments: [] }
  ];

  var nextId = 9;
  var filterMember = 0; // 0 = 全部
  var editingId = null;

  function member(id) {
    for (var i = 0; i < MEMBERS.length; i++) if (MEMBERS[i].id === id) return MEMBERS[i];
    return { id: id, name: '已删除', color: '#bcaaa4' };
  }
  function projOf(id) {
    for (var i = 0; i < PROJS.length; i++) if (PROJS[i].id === id) return PROJS[i];
    return PROJS[3];
  }
  function today() {
    var d = new Date();
    return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
  }

  function render() {
    var cols = { todo: [], doing: [], done: [] };
    tasks.forEach(function (t) {
      if (filterMember && t.assignee !== filterMember) return;
      if (projFilter && t.proj !== projFilter) return;
      (cols[t.col] || cols.todo).push(t);
    });

    ['todo', 'doing', 'done'].forEach(function (col) {
      var box = document.getElementById('col-' + col);
      box.innerHTML = '';
      cols[col].forEach(function (t) {
        box.appendChild(cardEl(t));
      });
      if (!cols[col].length) {
        box.innerHTML = '<div class="empty-hint">暂无任务，拖拽卡片到这里</div>';
      }
    });

    document.getElementById('cTodo').textContent = cols.todo.length;
    document.getElementById('cDoing').textContent = cols.doing.length;
    document.getElementById('cDone').textContent = cols.done.length;
    document.getElementById('mTodo').textContent = cols.todo.length;
    document.getElementById('mDoing').textContent = cols.doing.length;
    document.getElementById('mDone').textContent = cols.done.length;
    document.getElementById('mOverdue').textContent = tasks.filter(function (t) {
      return t.col !== 'done' && t.due && t.due < today();
    }).length;
    document.getElementById('heroActive').textContent = cols.doing.length;
    document.getElementById('heroUpdate').textContent = '最近刷新：' + new Date().toLocaleString('zh-CN', { hour12: false });

    var panel = document.getElementById('projPanel');
    if (projFilter) {
      panel.style.display = 'block';
      renderProjPanel();
    } else {
      panel.style.display = 'none';
    }
  }

  function cardEl(t) {
    var m = member(t.assignee);
    var pj = projOf(t.proj);
    var pLabel = { high: '高', mid: '中', low: '低' }[t.priority];
    var overdue = t.col !== 'done' && t.due && t.due < today();
    var el = document.createElement('div');
    el.className = 'card p-' + t.priority;
    el.draggable = true;
    el.dataset.id = t.id;
    el.innerHTML =
      '<div class="card-title"></div>' +
      '<div class="card-desc"></div>' +
      '<span class="tag ' + t.priority + '">优先级 ' + pLabel + '</span>' +
      '<span class="tag" style="color:' + pj.color + ';background:' + pj.bg + '">' + pj.name + '</span>' +
      '<div class="card-foot">' +
        '<span class="assignee"><span class="avatar" style="background:' + m.color + '">' + m.name.charAt(0) + '</span>' + m.name + '</span>' +
        '<span class="card-meta">' +
          (t.comments.length ? '<span>💬 ' + t.comments.length + '</span>' : '') +
          '<span class="due' + (overdue ? ' overdue' : '') + '">📅 ' + (t.due || '无日期') + '</span>' +
        '</span>' +
      '</div>';
    el.querySelector('.card-title').textContent = t.title;
    el.querySelector('.card-desc').textContent = t.desc;
    el.addEventListener('dragstart', function (e) {
      e.dataTransfer.setData('text/plain', String(t.id));
      el.classList.add('dragging');
    });
    el.addEventListener('dragend', function () { el.classList.remove('dragging'); });
    el.addEventListener('click', function () { openTask(t.id); });
    return el;
  }

  ['todo', 'doing', 'done'].forEach(function (col) {
    var column = document.querySelector('.column[data-col="' + col + '"]');
    column.addEventListener('dragover', function (e) {
      e.preventDefault();
      column.classList.add('drag-over');
    });
    column.addEventListener('dragleave', function (e) {
      if (!column.contains(e.relatedTarget)) column.classList.remove('drag-over');
    });
    column.addEventListener('drop', function (e) {
      e.preventDefault();
      column.classList.remove('drag-over');
      var id = Number(e.dataTransfer.getData('text/plain'));
      var t = tasks.find(function (x) { return x.id === id; });
      if (t && t.col !== col) {
        t.col = col;
        if (col === 'done') {
          t.comments.push({ who: 13, when: new Date().toLocaleString('zh-CN', { hour12: false }), text: '状态流转为已完成。' });
        }
        render();
      }
    });
  });

  // 负责人筛选（成员增删改后需重建）
  function buildFilters() {
    var box = document.getElementById('filters');
    box.innerHTML = '<span class="label">负责人：</span>';
    var mkChip = function (label, id, color) {
      var b = document.createElement('button');
      b.className = 'chip' + (id === filterMember ? ' active' : '');
      b.innerHTML = (color ? '<span class="dot" style="background:' + color + '">' + label.charAt(0) + '</span>' : '') + label;
      b.onclick = function () {
        filterMember = id;
        box.querySelectorAll('.chip').forEach(function (c) { c.classList.remove('active'); });
        b.classList.add('active');
        render();
      };
      box.appendChild(b);
    };
    mkChip('全部', 0);
    MEMBERS.forEach(function (m) { mkChip(m.name, m.id, m.color); });
  }
  buildFilters();

  // ========== 项目分类筛选 ==========
  function buildProjFilters() {
    var box = document.getElementById('projFilters');
    box.innerHTML = '<span class="label">项目：</span>';
    var mk = function (label, id) {
      var b = document.createElement('button');
      b.className = 'chip' + (id === projFilter ? ' active' : '');
      b.textContent = label;
      b.onclick = function () {
        projFilter = id;
        buildProjFilters();
        render();
      };
      box.appendChild(b);
    };
    mk('全部', '');
    PROJS.forEach(function (p) { mk(p.name, p.id); });
  }
  buildProjFilters();

  // ========== 项目工作区（评论 + 文档） ==========
  function renderProjPanel() {
    var p = projOf(projFilter);
    document.getElementById('projTitle').textContent = p.name + ' · 项目动态';
    var cbox = document.getElementById('projCommentList');
    cbox.innerHTML = '';
    var list = projComments[projFilter] || [];
    list.forEach(function (c) {
      var m = member(c.who);
      var div = document.createElement('div');
      div.className = 'comment-item';
      div.innerHTML =
        '<span class="avatar" style="background:' + m.color + '">' + m.name.charAt(0) + '</span>' +
        '<div><div class="who">' + m.name + '<span class="when">' + c.when + '</span></div><div class="text"></div></div>';
      div.querySelector('.text').textContent = c.text;
      cbox.appendChild(div);
    });
    if (!list.length) cbox.innerHTML = '<div style="font-size:13px;color:#bcaaa4;padding:8px 0">暂无项目评论</div>';

    var dbox = document.getElementById('docList');
    dbox.innerHTML = '';
    var docs = projDocs[projFilter] || [];
    docs.forEach(function (d, i) {
      var m = member(d.who);
      var row = document.createElement('div');
      row.className = 'doc-row';
      row.innerHTML =
        '<span>📄</span><span class="doc-name"></span>' +
        '<span class="doc-meta">' + d.size + ' · ' + m.name + ' · ' + d.when + '</span>';
      row.querySelector('.doc-name').textContent = d.name;
      var del = document.createElement('button');
      del.className = 'btn-del';
      del.textContent = '删除';
      del.onclick = function () {
        if (!confirm('确认删除文档「' + d.name + '」？')) return;
        projDocs[projFilter].splice(i, 1);
        renderProjPanel();
      };
      row.appendChild(del);
      dbox.appendChild(row);
    });
    if (!docs.length) dbox.innerHTML = '<div style="font-size:13px;color:#bcaaa4;padding:8px 0">暂无项目文档</div>';
  }
  function addProjComment() {
    var input = document.getElementById('projCommentInput');
    var text = input.value.trim();
    if (!text || !projFilter) return;
    (projComments[projFilter] = projComments[projFilter] || []).push({ who: 13, when: new Date().toLocaleString('zh-CN', { hour12: false }), text: text });
    input.value = '';
    renderProjPanel();
  }
  function uploadDoc(input) {
    var f = input.files && input.files[0];
    if (!f || !projFilter) return;
    var kb = f.size / 1024;
    var size = kb >= 1024 ? (kb / 1024).toFixed(1) + ' MB' : Math.max(1, Math.round(kb)) + ' KB';
    (projDocs[projFilter] = projDocs[projFilter] || []).push({ name: f.name, size: size, who: 13, when: new Date().toLocaleString('zh-CN', { hour12: false }) });
    input.value = '';
    renderProjPanel();
  }

  // ========== 成员管理 ==========
  function openMembers() {
    renderMembers();
    document.getElementById('memberMask').classList.add('show');
  }
  function closeMembers() {
    document.getElementById('memberMask').classList.remove('show');
  }
  function renderMembers() {
    var box = document.getElementById('memberList');
    box.innerHTML = '';
    MEMBERS.forEach(function (m, i) {
      var count = tasks.filter(function (t) { return t.assignee === m.id; }).length;
      var row = document.createElement('div');
      row.className = 'member-row';
      var color = document.createElement('input');
      color.type = 'color';
      color.className = 'color-input';
      color.value = m.color;
      color.title = '头像颜色';
      color.onchange = function () { m.color = color.value; syncMembers(); };
      var name = document.createElement('input');
      name.type = 'text';
      name.value = m.name;
      name.maxLength = 6;
      name.onchange = function () {
        var v = name.value.trim();
        if (!v) { name.value = m.name; return; }
        m.name = v;
        syncMembers();
      };
      var countEl = document.createElement('span');
      countEl.className = 'task-count';
      countEl.textContent = count + ' 个任务';
      var del = document.createElement('button');
      del.className = 'btn-del';
      del.textContent = '删除';
      del.onclick = function () { deleteMember(i); };
      row.appendChild(color);
      row.appendChild(name);
      row.appendChild(countEl);
      row.appendChild(del);
      box.appendChild(row);
    });
  }
  function syncMembers() {
    buildFilters();
    render();
  }
  function addMember() {
    var name = document.getElementById('newName').value.trim();
    if (!name) { alert('请填写成员名称'); return; }
    var maxId = 0;
    MEMBERS.forEach(function (m) { if (m.id > maxId) maxId = m.id; });
    MEMBERS.push({ id: maxId + 1, name: name, color: document.getElementById('newColor').value });
    document.getElementById('newName').value = '';
    syncMembers();
    renderMembers();
  }
  function deleteMember(i) {
    var m = MEMBERS[i];
    var count = tasks.filter(function (t) { return t.assignee === m.id; }).length;
    if (count > 0) {
      alert('「' + m.name + '」名下还有 ' + count + ' 个任务，请先把任务转移给其他负责人。');
      return;
    }
    if (!confirm('确认删除成员「' + m.name + '」？')) return;
    MEMBERS.splice(i, 1);
    if (filterMember === m.id) filterMember = 0;
    syncMembers();
    renderMembers();
  }
  document.getElementById('memberMask').addEventListener('click', function (e) {
    if (e.target === this) closeMembers();
  });

  // 弹窗
  function fillAssignee(select, current) {
    select.innerHTML = '';
    MEMBERS.forEach(function (m) {
      var o = document.createElement('option');
      o.value = m.id;
      o.textContent = m.name;
      if (m.id === current) o.selected = true;
      select.appendChild(o);
    });
  }
  function fillProj(select, current) {
    select.innerHTML = '';
    PROJS.forEach(function (p) {
      var o = document.createElement('option');
      o.value = p.id;
      o.textContent = p.name;
      if (p.id === current) o.selected = true;
      select.appendChild(o);
    });
  }
  function renderComments(t) {
    var box = document.getElementById('commentList');
    box.innerHTML = '';
    t.comments.forEach(function (c) {
      var m = member(c.who);
      var div = document.createElement('div');
      div.className = 'comment-item';
      div.innerHTML =
        '<span class="avatar" style="background:' + m.color + '">' + m.name.charAt(0) + '</span>' +
        '<div><div class="who">' + m.name + '<span class="when">' + c.when + '</span></div><div class="text"></div></div>';
      div.querySelector('.text').textContent = c.text;
      box.appendChild(div);
    });
    if (!t.comments.length) box.innerHTML = '<div style="font-size:13px;color:#bcaaa4;padding:8px 0">暂无评论</div>';
  }
  function openTask(id) {
    var t = tasks.find(function (x) { return x.id === id; });
    if (!t) return;
    editingId = id;
    document.getElementById('dlgTitle').textContent = '任务详情';
    document.getElementById('fTitle').value = t.title;
    document.getElementById('fDesc').value = t.desc;
    document.getElementById('fDue').value = t.due || '';
    document.getElementById('fPriority').value = t.priority;
    fillProj(document.getElementById('fProj'), t.proj);
    fillAssignee(document.getElementById('fAssignee'), t.assignee);
    renderComments(t);
    document.getElementById('mask').classList.add('show');
  }
  function openNew(col) {
    editingId = null;
    document.getElementById('dlgTitle').textContent = '新建任务';
    document.getElementById('fTitle').value = '';
    document.getElementById('fDesc').value = '';
    document.getElementById('fDue').value = '';
    document.getElementById('fPriority').value = 'mid';
    fillProj(document.getElementById('fProj'), projFilter || 'other');
    fillAssignee(document.getElementById('fAssignee'), 13);
    document.getElementById('commentList').innerHTML = '<div style="font-size:13px;color:#bcaaa4;padding:8px 0">新建后可添加评论</div>';
    document.getElementById('mask').dataset.col = col || 'todo';
    document.getElementById('mask').classList.add('show');
    document.getElementById('fTitle').focus();
  }
  function closeDialog() {
    document.getElementById('mask').classList.remove('show');
  }
  function saveTask() {
    var title = document.getElementById('fTitle').value.trim();
    if (!title) { alert('请填写任务标题'); return; }
    var data = {
      title: title,
      desc: document.getElementById('fDesc').value.trim(),
      assignee: Number(document.getElementById('fAssignee').value),
      due: document.getElementById('fDue').value,
      priority: document.getElementById('fPriority').value,
      proj: document.getElementById('fProj').value
    };
    if (editingId) {
      var t = tasks.find(function (x) { return x.id === editingId; });
      Object.assign(t, data);
    } else {
      tasks.push(Object.assign({ id: nextId++, col: document.getElementById('mask').dataset.col || 'todo', comments: [] }, data));
    }
    closeDialog();
    render();
  }
  function deleteTask() {
    if (!editingId) return;
    if (!confirm('确认删除该任务？')) return;
    tasks = tasks.filter(function (x) { return x.id !== editingId; });
    closeDialog();
    render();
  }
  function addComment() {
    var input = document.getElementById('commentInput');
    var text = input.value.trim();
    if (!text || !editingId) return;
    var t = tasks.find(function (x) { return x.id === editingId; });
    t.comments.push({ who: 13, when: new Date().toLocaleString('zh-CN', { hour12: false }), text: text });
    input.value = '';
    renderComments(t);
    render();
  }
  document.getElementById('mask').addEventListener('click', function (e) {
    if (e.target === this) closeDialog();
  });

  render();
</script>
</body>
</html>
