org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=1G -Dfile.encoding=UTF-8
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# Backend used by native requests and the WebView frontend.
# For a backend running on the emulator host, use http://10.0.2.2:9000
# Rebuild and reinstall the app after changing this value.
# backend_endpoint=https://api.loghome.ink
backend_endpoint=http://10.0.2.2:9000

# Leave empty to load the packaged web.zip.
# Set to http://10.0.2.2:8080/ to use the host dev server in emulator debug builds.
loghomeWebviewEntryUrl=http://10.0.2.2:8080/
