plugins {
    id "com.android.application"
    id "org.jetbrains.kotlin.android"
}

def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file("key.properties")
if (!keystorePropertiesFile.exists()) {
    keystorePropertiesFile = rootProject.file("../loghome-flutter/android/key.properties")
}
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

def resolveStoreFile = { String storeFilePath ->
    if (!storeFilePath) {
        return null
    }
    List<File> candidates = [
            file(storeFilePath),
            rootProject.file(storeFilePath),
            new File(keystorePropertiesFile.parentFile, storeFilePath),
            new File(new File(keystorePropertiesFile.parentFile, "app"), storeFilePath),
    ]
    for (File candidate : candidates) {
        if (candidate.exists()) {
            return candidate
        }
    }
    return candidates.last()
}

def webviewEntryUrl = ((project.findProperty("loghomeWebviewEntryUrl")
        ?: System.getenv("LOGHOME_WEBVIEW_ENTRY_URL")
        ?: "") as String).trim()
def escapedWebviewEntryUrl = webviewEntryUrl
        .replace("\\", "\\\\")
        .replace("\"", "\\\"")

android {
    namespace "top.codesocean.loghome.android"
    compileSdk 34

    defaultConfig {
        applicationId "top.codesocean.loghome"
        minSdk 24
        targetSdk 34
        versionCode 307
        versionName "2.9.16"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        vectorDrawables {
            useSupportLibrary true
        }
    }

    signingConfigs {
        release {
            if (keystorePropertiesFile.exists()) {
                keyAlias keystoreProperties["keyAlias"]
                keyPassword keystoreProperties["keyPassword"]
                storeFile resolveStoreFile(keystoreProperties["storeFile"])
                storePassword keystoreProperties["storePassword"]
            }
        }
    }

    buildTypes {
        debug {
            debuggable true
            minifyEnabled false
            buildConfigField "String", "WEBVIEW_ENTRY_URL", "\"${escapedWebviewEntryUrl}\""
        }
        release {
            if (keystorePropertiesFile.exists()) {
                signingConfig signingConfigs.release
            }
            minifyEnabled false
            buildConfigField "String", "WEBVIEW_ENTRY_URL", "\"\""
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = "17"
    }

    buildFeatures {
        viewBinding true
        buildConfig true
    }

    packaging {
        resources {
            excludes += ["/META-INF/{AL2.0,LGPL2.1}"]
        }
    }
}

dependencies {
    implementation "androidx.activity:activity-ktx:1.9.0"
    implementation "androidx.appcompat:appcompat:1.7.0"
    implementation "androidx.core:core-ktx:1.13.1"
    implementation "androidx.lifecycle:lifecycle-runtime-ktx:2.8.3"
    implementation "com.google.android.material:material:1.12.0"
    implementation "androidx.media3:media3-exoplayer:1.4.1"
    implementation "androidx.media3:media3-session:1.4.1"
    implementation "com.squareup.okhttp3:okhttp:4.12.0"
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1"
}
